<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de propinas</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/stilos.css">
</head>
<body>
    <main>
        <h1>Calculadora de propinas</h1>

        <form id="form-propina">
            <label for="propina-total">Propina total (se ingresa una vez)</label>
            <div class="campo-moneda">
                <input id="propina-total" name="propina-total" type="text" inputmode="decimal" placeholder="0,00" required>
            </div>

            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" required>

            <label for="horas-trabajadas">Horas trabajadas</label>
            <input id="horas-trabajadas" name="horas-trabajadas" type="number" min="0" step="0.01" required>

            <button id="btn-agregar" type="submit">Agregar persona</button>
        </form>

        <button id="btn-toggle-descuentos" type="button" aria-expanded="false" aria-controls="panel-descuentos">
            Mostrar descuentos
        </button>
        <section id="panel-descuentos" hidden>
            <h2>Descuentos</h2>
            <form id="form-descuento">
                <label for="descuento-persona">Descontar a</label>
                <select id="descuento-persona" required>
                    <option value="">Selecciona un participante</option>
                </select>

                <label for="descuento-monto">Monto del descuento</label>
                <div class="campo-moneda">
                    <input id="descuento-monto" type="text" inputmode="decimal" placeholder="0,00" required>
                </div>

                <label for="descuento-fecha">Día del descuento</label>
                <input id="descuento-fecha" type="date" required>

                <label for="descuento-motivo">Motivo</label>
                <textarea id="descuento-motivo" rows="3" required></textarea>

                <button type="submit">Agregar descuento</button>
            </form>
            <ul id="lista-descuentos"></ul>
        </section>

        <section>
            <h2>Participantes</h2>
            <ul id="participantes"></ul>
        </section>

        <section>
            <h2>Resultado</h2>
            <ul id="resultado"><li>0.00</li></ul>
        </section>

        <button id="btn-toggle-historial" type="button" aria-expanded="false" aria-controls="panel-historial">
            Mostrar historial
        </button>
        <section id="panel-historial" hidden>
            <h2>Historial</h2>
            <ul id="historial"></ul>
        </section>

        <button id="btn-reiniciar" type="button">Reiniciar todo</button>
    </main>

    <script src="js/mains.js?v=6"></script>
</body>
</html>
